name: npm publish

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke test
        run: |
          pnpm run test-server &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died during startup"
              exit 1
            fi
            if curl -sSf http://localhost:3000/micropub -o /dev/null 2>/dev/null; then
              echo "Server smoke test passed"
              kill $SERVER_PID 2>/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within timeout"
          kill $SERVER_PID 2>/dev/null
          exit 1
      - name: Verify packaging
        run: pnpm -r pack --dry-run

  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry:
          - name: core
            filter: '@postr/core'
            build: ''
          - name: plugin
            filter: '@postr/plugin'
            build: ''
          - name: plugin-feeds
            filter: '@postr/plugin-feeds'
            build: ''
          - name: plugin-webmention-endpoint
            filter: '@postr/plugin-webmention-endpoint'
            build: ''
          - name: syndicator
            filter: '@postr/syndicator'
            build: ''
          - name: syndicator-instagram
            filter: '@postr/syndicator-instagram'
            build: ''
          - name: syndicator-superfeedr
            filter: '@postr/syndicator-superfeedr'
            build: ''
          - name: syndicator-telegram
            filter: '@postr/syndicator-telegram'
            build: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pre-publish build
        if: ${{ matrix.entry.build != '' }}
        run: pnpm --filter ${{ matrix.entry.filter }} run ${{ matrix.entry.build }}
      - name: Publish workspace package
        run: pnpm --filter ${{ matrix.entry.filter }} publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
