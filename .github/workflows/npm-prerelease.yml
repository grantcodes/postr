# Alpha release workflow: release-please + OIDC publish to npm tag `alpha`
#
# Flow:
#   - Pushes to `dev` ⟶ release-please opens/updates a Release PR against `dev`
#   - Merging that Release PR to `dev` ⟶ GitHub Releases + tags are created
#   - Only when releases_created=true do we publish to npm with tag `alpha`
#   - Uses npm trusted publishing via OIDC (no long-lived tokens)
#
# Versions come from release-please-config.dev.json (`versioning: prerelease`,
# `prerelease-type: alpha.0`): 2.0.0-alpha.0, 2.0.0-alpha.1, …
# The `alpha` dist-tag keeps `npm i @postr/core` on `latest`; alphas need
# `npm i @postr/core@alpha`.
#
# Reference: https://github.com/googleapis/release-please-action

name: npm-prerelease

on:
  push:
    branches:
      - dev
  # Publishes already-released packages whose publish failed, at their
  # current versions.
  workflow_dispatch:
    inputs:
      paths:
        description: >-
          JSON array of package paths to publish, e.g. ["packages/core"]
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run can leave tagged releases unpublished.
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Verify packaging
        run: pnpm run check

      # ── OIDC guard ────────────────────────────────────────────────

      - name: Guard - No npm token-based auth (must use OIDC only)
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo 'ERROR: npm token environment variables detected.'
            echo 'Alpha releases must use OIDC trusted publishing only.'
            exit 1
          fi
          echo 'OK: No npm token environment variables present'

      - name: Guard - OIDC prerequisites available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] &&
            [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo 'ERROR: OIDC token request env vars not found.'
            echo 'Ensure the id-token: write permission is set.'
            exit 1
          fi
          echo 'OK: OIDC environment available'

      # ── Release-please ─────────────────────────────────────────────

      - uses: googleapis/release-please-action@v4
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          manifest: true
          target-branch: dev
          config-file: release-please-config.dev.json
          manifest-file: .release-please-manifest.json

      # ── Publish released packages to npm tag `alpha` ───────────────

      - name: Publish released packages to alpha
        if: >-
          steps.release.outputs.releases_created == 'true' ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/dev')
        env:
          PATHS_RELEASED: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.paths
            || steps.release.outputs.paths_released }}
        run: node scripts/publish-release-please-packages.ts alpha
