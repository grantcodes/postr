# Builds the VitePress site in docs/ and deploys it to GitHub Pages (postr.dev).
# Requires Settings → Pages → Source: "GitHub Actions".

name: docs

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress reads Git history for "last updated" dates.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
